plugins {
    id 'com.android.application' version '9.4.1'
}

android {
    namespace = 'io.github.mogeldev.scda'
    compileSdk = 36
    ndkVersion = '29.0.14206865'
    defaultConfig {
        applicationId = 'io.github.mogeldev.scda'
        minSdk = 29 // Android 10 support is experimental.
        targetSdk = 36
        versionCode = 8
        versionName = '0.1.0-testing.6'
        // Installed native tools execute from nativeLibraryDir, never writable app storage.
        // x86_64 for the emulator; -Pabi=x86_64 builds one
        ndk { abiFilters(*(project.findProperty('abi')?.split(',') ?: ['arm64-v8a', 'x86_64'])) }
        externalNativeBuild {
            cmake {
                // the shared C++ runtime: exceptions cross from the host into the game code
                // -PdevCode carries the game code from generated/ in the APK, for development only
                arguments '-DANDROID_STL=c++_shared', "-DSCDA_DEV_CODE=${project.hasProperty('devCode') ? 'ON' : 'OFF'}"
            }
        }
    }
    // Project policy: debug certificates only, including RC/stable release variants.
    buildTypes {
        debug { signingConfig = signingConfigs.debug }
        release { signingConfig = signingConfigs.debug }
    }
    sourceSets.main {
        assets.srcDirs = ['src/main/assets', '../out/android-tools/assets']
        jniLibs.srcDirs = ['src/main/jniLibs', '../out/android-tools/jniLibs']
    }
    packaging.jniLibs {
        useLegacyPackaging = true
        keepDebugSymbols += ['**/*.so']
    }
    externalNativeBuild {
        cmake {
            path = file('../CMakeLists.txt')
            version = '3.31.6'
        }
    }
}

// No prebuilt host APK is used: compiler tools are staged separately from this build's runtime.
def stageOnDeviceTools = tasks.register('stageOnDeviceTools') {
    doLast {
        if (!project.hasProperty('toolsStaged')) {
            providers.exec {
                workingDir rootDir.parentFile
                commandLine 'python', 'tools/on-device-setup/build.py', '--sdk', androidComponents.sdkComponents.sdkDirectory.get().asFile.absolutePath,
                    '--production', '--stage-only'
                environment 'PYTHONDONTWRITEBYTECODE', '1'
            }.result.get().assertNormalExitValue()
        }
        if (!file('../out/android-tools/assets/compiler/version').isFile()) {
            throw new GradleException('Missing staged on-device compiler; run stageOnDeviceTools without -PtoolsStaged')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(stageOnDeviceTools) }
